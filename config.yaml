name: "Linkding"
description: "linkding is a bookmark manager designed be to be minimal, fast, and easy to set up."
version: "1.44.1-1"
slug: "linkding"
init: false
arch:
  - aarch64
  - amd64
  - armv7
ports:
  9090/tcp: 9090
startup: services
url: https://github.com/diyanei/hassio-linkding
map:
  - type: data
    read_only: false
    path: /etc/linkding/data
options:
  superuser_name: null
  superuser_password: null
  superuser_email: null
  max_memory_MB: 0
  ssl: false
schema:
  superuser_name: str?
  superuser_password: password?
  superuser_email: email?
  max_memory_MB: int
  ssl: bool
webui: "[PROTO:ssl]://[HOST]:[PORT:9090]"